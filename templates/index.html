<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 대시보드 UI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F7FF',
              100: '#E0EFFF',
              200: '#BAE0FF',
              300: '#7CC4FA',
              400: '#38A3F8',
              500: '#0C87EB',
              600: '#006BCA',
              700: '#0155A4',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 전체 화면 스크롤 방지 및 높이 고정 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-brand-50 text-slate-800 flex flex-col h-screen w-screen">

  <!-- ========================================== -->
  <!-- 1. 상단 메인 영역 (세로 85% 차지, 가로 100%) -->
  <!-- ========================================== -->
  <main class="h-[85vh] w-full flex flex-col p-4 md:p-6 pb-2 box-border">
    <!-- 상단 헤더 / 네비게이션 바 -->
    <header class="w-full bg-white/80 backdrop-blur-md border border-brand-200/60 rounded-2xl px-6 py-3.5 flex items-center justify-between shadow-sm mb-4 shrink-0">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-500 text-white rounded-xl shadow-md shadow-brand-500/20">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 tracking-tight">수익 및 자산 분석 센터</h1>
          <p class="text-xs text-brand-600 font-medium">실시간 통합 포트폴리오 관리</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 bg-brand-50/70 border border-brand-100 rounded-xl px-3 py-1.5 text-xs text-slate-600">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          서버 상태: <strong class="text-slate-800">정상 가동 중</strong>
        </div>
        <button class="p-2 text-slate-500 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-colors">
          <i data-lucide="bell" class="w-5 h-5"></i>
        </button>
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-400 to-brand-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
          JD
        </div>
      </div>
    </header>

    <!-- 상단 메인 콘텐츠 그리드 (남은 높이를 채움) -->
    <div class="flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-4 min-h-0">

      <!-- 좌측 2열: 메인 차트 & 모니터링 뷰 -->
      <section class="lg:col-span-2 bg-white border border-brand-200/60 rounded-2xl p-5 shadow-sm flex flex-col justify-between overflow-hidden">
        <div class="flex items-center justify-between mb-2">
          <div>
            <h2 class="text-base font-bold text-slate-800">실시간 자산 변동 그래프</h2>
            <p class="text-xs text-slate-400">최근 30일 간의 누적 수익률 및 원화 잔고 추이</p>
          </div>
          <div class="flex gap-1.5 bg-brand-50 p-1 rounded-xl border border-brand-100 text-xs">
            <button class="px-3 py-1 rounded-lg bg-white text-brand-600 font-semibold shadow-xs">일간</button>
            <button class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-700">주간</button>
            <button class="px-3 py-1 rounded-lg text-slate-500 hover:text-slate-700">월간</button>
          </div>
        </div>

        <!-- 가상 차트 시각화 영역 -->
        <div class="relative flex-1 w-full bg-gradient-to-b from-brand-50/50 to-white rounded-xl border border-dashed border-brand-200 p-4 flex flex-col justify-end min-h-[160px]">
          <!-- 배경 그리드 라인 -->
          <div class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none opacity-40">
            <div class="border-b border-brand-200 w-full"></div>
            <div class="border-b border-brand-200 w-full"></div>
            <div class="border-b border-brand-200 w-full"></div>
            <div class="border-b border-brand-200 w-full"></div>
          </div>

          <!-- 모의 파동 그래프 (SVG) -->
          <svg class="w-full h-full absolute inset-0 preserve-3d" preserveAspectRatio="none" viewBox="0 0 100 40">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#38A3F8" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#38A3F8" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <path d="M 0,35 Q 15,28 30,30 T 60,18 T 85,12 T 100,8 L 100,40 L 0,40 Z" fill="url(#grad)" />
            <path d="M 0,35 Q 15,28 30,30 T 60,18 T 85,12 T 100,8" fill="none" stroke="#0C87EB" stroke-width="1.8" />
          </svg>

          <!-- 차트 오버레이 수치 -->
          <div class="relative z-10 flex justify-between items-end">
            <div>
              <span class="text-xs font-semibold text-brand-600 bg-brand-100/80 px-2.5 py-1 rounded-md">현재 총 평가액</span>
              <p class="text-2xl font-black text-slate-800 mt-1">₩ 409,228,000</p>
            </div>
            <div class="text-right">
              <span class="text-xs text-emerald-600 font-bold bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full inline-flex items-center gap-1">
                <i data-lucide="trending-up" class="w-3 h-3"></i> +12.4%
              </span>
              <p class="text-[11px] text-slate-400 mt-1">전월 마감 대비</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 우측 1열: 주요 상태 요약 패널 -->
      <section class="bg-white border border-brand-200/60 rounded-2xl p-5 shadow-sm flex flex-col justify-between overflow-hidden">
        <div>
          <h2 class="text-base font-bold text-slate-800 mb-1">운용 요약</h2>
          <p class="text-xs text-slate-400 mb-4">현재 세션 및 실행 환경</p>

          <div class="space-y-3">
            <div class="p-3 bg-brand-50/60 border border-brand-100 rounded-xl flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="p-2 bg-white rounded-lg text-brand-500 shadow-xs border border-brand-100">
                  <i data-lucide="wallet" class="w-4 h-4"></i>
                </div>
                <div>
                  <p class="text-xs text-slate-500">원화 잔고</p>
                  <p class="text-sm font-bold text-slate-800">₩ 58,143,200</p>
                </div>
              </div>
              <span class="text-xs font-semibold text-brand-600 bg-white px-2 py-1 rounded-lg border border-brand-100">가용 100%</span>
            </div>

            <div class="p-3 bg-brand-50/60 border border-brand-100 rounded-xl flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="p-2 bg-white rounded-lg text-emerald-500 shadow-xs border border-brand-100">
                  <i data-lucide="shield-check" class="w-4 h-4"></i>
                </div>
                <div>
                  <p class="text-xs text-slate-500">포트폴리오 보안</p>
                  <p class="text-sm font-bold text-slate-800">정상 보호됨</p>
                </div>
              </div>
              <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-100">안전</span>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
          <span class="text-xs text-slate-400">최근 업데이트: 1분 전</span>
          <button class="px-3 py-1.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm shadow-brand-500/20">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 새로고침
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- ========================================== -->
  <!-- 2. 하단 보조 카드 영역 (세로 15% 차지, 가로 100%) -->
  <!-- ========================================== -->
  <aside class="h-[15vh] w-full px-4 md:px-6 pb-4 pt-1 box-border">
    <div class="h-full w-full grid grid-cols-2 md:grid-cols-4 gap-3">

      <!-- 보조 카드 1 -->
      <div class="bg-white/90 border border-brand-200/70 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs hover:border-brand-400 hover:shadow-sm transition-all">
        <div class="min-w-0">
          <p class="text-[11px] font-medium text-slate-400 truncate">오늘 수익</p>
          <p class="text-base font-extrabold text-slate-800 tracking-tight truncate">+₩ 1,420,000</p>
        </div>
        <div class="p-2 rounded-lg bg-brand-50 text-brand-500 shrink-0">
          <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- 보조 카드 2 -->
      <div class="bg-white/90 border border-brand-200/70 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs hover:border-brand-400 hover:shadow-sm transition-all">
        <div class="min-w-0">
          <p class="text-[11px] font-medium text-slate-400 truncate">거래 체결률</p>
          <p class="text-base font-extrabold text-slate-800 tracking-tight truncate">98.6%</p>
        </div>
        <div class="p-2 rounded-lg bg-emerald-50 text-emerald-500 shrink-0">
          <i data-lucide="activity" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- 보조 카드 3 -->
      <div class="bg-white/90 border border-brand-200/70 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs hover:border-brand-400 hover:shadow-sm transition-all">
        <div class="min-w-0">
          <p class="text-[11px] font-medium text-slate-400 truncate">활성 노드</p>
          <p class="text-base font-extrabold text-slate-800 tracking-tight truncate">12 / 12 정상</p>
        </div>
        <div class="p-2 rounded-lg bg-sky-50 text-sky-500 shrink-0">
          <i data-lucide="cpu" class="w-4 h-4"></i>
        </div>
      </div>

      <!-- 보조 카드 4 -->
      <div class="bg-white/90 border border-brand-200/70 rounded-xl px-4 py-2 flex items-center justify-between shadow-xs hover:border-brand-400 hover:shadow-sm transition-all">
        <div class="min-w-0">
          <p class="text-[11px] font-medium text-slate-400 truncate">시스템 상태</p>
          <p class="text-base font-extrabold text-slate-800 tracking-tight truncate">최적화 완료</p>
        </div>
        <div class="p-2 rounded-lg bg-blue-50 text-brand-600 shrink-0">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        </div>
      </div>

    </div>
  </aside>

  <!-- Lucide 아이콘 렌더링 스크립트 -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
